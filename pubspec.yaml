name: mediguide
description: MediGuide - accès aux soins de santé en Afrique de l'Ouest (Togo, Burkina Faso, Côte d'Ivoire).
publish_to: 'none'
version: 1.0.0+1

environment:
  # À adapter à ta version de Flutter.
  sdk: ^3.4.0

# Versions volontairement non figées ("any") : `flutter pub get` résout les
# dernières versions compatibles entre elles (important pour les packages
# Firebase, qui doivent être alignés). Une fois que tout marche, tu peux
# figer les versions résolues en copiant celles de pubspec.lock.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

  # Data service (Overpass API)
  http: 1.6.0

  # Carte OpenStreetMap
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Appels et itinéraires vers les apps natives
  url_launcher: ^6.3.2

  # Rappels de l'espace maternité (fonctionnent hors-ligne)
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

  # Banner offline
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Le fichier doit exister, sinon le build échoue.
  assets:
    - assets/data/emergencies.json